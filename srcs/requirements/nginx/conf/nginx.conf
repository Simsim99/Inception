server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Dummy/Self-signed SSL certs needed so TLS handshake succeeds before dropping
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Close connection instantly without returning headers or content
    return 444; 
}

server {
    # Listen on port 443 and expect encrypted (SSL/TLS) traffic.
    # [::] is the IPv6 equivalent of 0.0.0.0, future-proofing the server.
    # 0.0.0.0 means "Listen to EVERY incoming IPv4 address."
    # [::] is the IPv6 equivalent of 0.0.0.0. It means "Listen to EVERY incoming IPv6 address."
    # now both ipv4 and ipv6 users can connect to the website
    listen 443 ssl;
    listen [::]:443 ssl;

    # NGINX compares the domain in the URL with this name. 
    # If a user types localhost, it ignores it because it doesn't match.
    # ! unless if it is 127.0.0.1, which will serve the FIRST server block here as a default server
    # normally there should be a marked server block as a default server but this works too 
    server_name ouchouir.42.fr;

    # .crt is the public padlock given to the client's browser to prove we are legit.
    # .key is the private key NGINX uses to decrypt the packets received from the browser.
    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Tells NGINX where to fetch static files (HTML text, images, CSS) from which is /var/www/html(on disk thanks to mount)
    # /var/www/html + style.css from URL
    # root here means root directory (/var/www/html) not the superuser
    # it gives NGINX access to every file in the wordpress installation
    root /var/www/html;

    # By default, if a user asks for a folder (like the root URL '/'), NGINX would show a list of all files (a security risk!).
    # The 'index' directive acts like a librarian handing you an "Index Card" instead of the whole drawer.
    # It tells NGINX to automatically look for and serve 'index.php' first, then 'index.html'.
    # These index files do not contain pictures; they are just plain text (HTML/PHP) that acts as the webpage's skeleton.
    # Pictures are separate files fetched later based on <img src="..."> tags in the text.
    # index.php can either be profile of the logged in user or public home page of a guest
    # index.html is a one fixed page for everyone (no profiles, no logins, no database).
    index index.php index.html;

    # Matches ALL URLs.
    location / {
        # /: start at root domain (https://ouchouir.42.fr/ <- this one)
        # $uri: Try to find the exact file requested (like cat.jpg). If it's a static file, NGINX serves it instantly.
        # $uri/: Try to find it as a directory.
        # /index.php?$args: If neither exists, fall back to index.php. 
        # This is mandatory for WordPress "pretty URLs" (like /about-us/) which don't exist on the SSD but are stored in the database.
        try_files $uri $uri/ /index.php?$args;
    }

    location /static {
        # The trailing slash after 80 / is CRITICAL! It tells NGINX to strip '/static' from the URL 
        # and replace it with '/'. So the static container receives a request for '/' instead of '/static',
        # allowing it to find the index.html file at its root.
        # proxy_pass: foward it to the smaller nginx on the static container, no translation needed
        proxy_pass http://static-website:80/;
    }
        # Catches all traffic asking for /adminer.
    # We need this because Adminer files are in a different path (/var/www/html/adminer) than WordPress.
    location /adminer {
        # Tries to find the exact file, then the directory, then falls back to Adminer's index.php.
        try_files $uri $uri/ /adminer/index.php?$args;
    }

    # Regex to catch ANY .php file requested inside the /adminer/ path.
    # CRITICAL: Without this, the general ~ \.php$ block below would catch it and send it to the WordPress container, which would crash!
    location ~ ^/adminer/.*\.php$ {
        include fastcgi_params;
        # Sends the request to the adminer container's PHP-FPM engine on port 9000 using Docker's internal DNS.
        fastcgi_pass adminer:9000;
        # Resolves to /var/www/html/adminer/index.php and tells the Adminer container to execute it.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    # ~ means Regular Expression. \.php$ matches any URL ending in .php.
    # This block is prioritized over the location / block.
    location ~ \.php$ {
        # Load standard FastCGI translation rules by attaching the visitor's ip address + browser type + request type(GET/POST) so php-fpm gets all details
        include fastcgi_params;
        # Send the FastCGI packet to the wordpress container on port 9000 using Docker's internal DNS.
        fastcgi_pass wordpress:9000;
        # Tells the blind PHP-FPM engine exactly which file to execute by combining the root path and the script name.
        # $document_root is var/www/html + $fastcgi_script_name is /"what is after root"
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    #! IMPORTANT: In NGINX, Regex rules (~) almost ALWAYS beat standard Prefix rules (location /path).
    # that is how NGINX breaks a tie when 2 or moree location blocks natch the URL
}