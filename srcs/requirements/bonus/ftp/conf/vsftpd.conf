# vsftpd= Very Secure FTP Daemon.
# Listens for Connections on network ports (by default, Port 21).
# Handles Authentication: It verifies usernames and passwords when a client (like FileZilla, curl, or a browser) tries to log in.
# Manages File Operations: It allows authenticated users to view directory contents, upload files, download files, rename items,
# and delete files on the server's disk.

# prevents vsftpd from running as background daemon
background=NO
# tell it to run by itself by opening port 21
# Stand at Door 1 (IPv4) and listen for incoming FTP users
listen=YES
# Do NOT try to guard Door 2 (IPv6) at the same time.
# to avoid crash
listen_ipv6=NO

# Disables unauthentic "anonymous" logins like guest users from
# connecting without valid credentials
# We don't want random strangers on the internet to be able to
# drop files into our WordPress site.
anonymous_enable=NO
# allow local linux users (created via "useradd" in my init.sh) to log in via ftp
# this way my custom ftp user(init.sh) can authenticate with the system credentials created at startup
# and be allowed to upload, edit, rename, and delete WordPress files.
local_enable=YES
write_enable=YES
# Restricts authenticated local users to their designated home directory (/var/www/html)
# Trap the user inside their home directory
# Traps the FTP user inside the WordPress directory. Running commands like cd /etc or cd /var/log will fail because the
# user perceives /var/www/html as the root directory (/).
chroot_local_user=YES
# Allows a user to log in even if the root folder of their chroot jail (/var/www/html) is writeable
# vsftpd has a security check that refuses to log in chrooted users if the root of their home directory is writeable by default. Setting
# this to YES bypasses that restriction, allowing direct file management inside /var/www/html.
# By default, vsftpd freaks out and crashes if a trapped user has permission to write directly inside their root folder (it considers
# writeable root folders a security risk). This setting tells vsftpd: "It's okay, let them write directly inside /var/www/html."
allow_writeable_chroot=YES

# Switches FTP data connections to Passive Mode (the client initiates connections to the server for data transfers, rather than
# the server connecting back to the client).
# Tell vsftpd to use the host's IP for passive connections (pasv_address=127.0.0.1 or VM's IP).
# Necessary when client machines or containers sit behind firewalls or Docker NAT networks??
# Firewalls and NAT networks (like Docker's bridge network) almost always allow outgoing connections started by a client, but block unexpected incoming connections initiated by a server.
# solution: You force the client machine to initiate both the control and data connections.
#           Docker NAT easily forwards both connections through published ports (e.g., 21 and 30000-30009) without getting blocked by firewalls.
pasv_enable=YES
# Restricts the dynamic range of ports used for passive data transfers to a fixed range (ports 30000 to 30009).
# so vsftpd does not pick a random port from 1024 to 65535, making it impossible to forward passive channels through Docker.
# i will make sure to expose them in .YAML (putting in them in the allowed list so firewall/NAT is happy)
pasv_min_port=30000
pasv_max_port=30009
# Tells the client to connect to this IP for passive data transfers.
pasv_address=127.0.0.1
# Disable SSL reuse to prevent timeouts during data transfer
# accept encrypton using keyB(born when connecting via port 30000) instead of
# keyA(born when connecting via port 21) between browser and server,
# do not freak out(vsftpd) it is the same client
require_ssl_reuse=NO


