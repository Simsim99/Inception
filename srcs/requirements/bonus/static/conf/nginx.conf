server {
    # Listens on port 80 (HTTP). We don't need SSL (443) here because the main NGINX container 
    # already handles the secure encrypted connection with the user and forwards it internally as plain HTTP.
    listen 80;
    
    # Generic placeholder. Since this container is hidden inside the private Docker network, 
    # it doesn't care what domain name the user typed. It just processes whatever the main NGINX forwards to it.
    server_name localhost;

    # Tells NGINX where to look for the static files on the hard drive.
    root /var/www/html;
    
    # When a user asks for a folder (like the root URL '/'), automatically look for and serve 'index.html'.
    index index.html;

    # Matches all traffic.
    location / {
        # Try to find the exact file requested ($uri).
        # If that doesn't exist, try to find a directory with that name ($uri/).
        # If neither exists, return a 404 Not Found error (=404).
        # We use =404 instead of falling back to index.php because this is a static site with no PHP/database!
        try_files $uri $uri/ =404;
    }
}